# DO-NOT-EDIT. Generated by docs/modules/issues.nix (the issue form). Regenerate: cd docs && nix run .#write-files
"body":
  -
    "attributes":
      "value": "Thanks for writing. CI evaluates every `nix` block of this issue as one yen fleet and comments the answer, so a small module that shows the problem gets a fast reply."
    "type": "markdown"
  -
    "attributes":
      "description": "A file of `modules/`: `{ yen, lib, ... }: { … }`. Declare the kinds it needs. `lib` is nixpkgs lib."
      "label": "A yen module"
      "render": "nix"
    "id": "module"
    "type": "textarea"
    "validations":
      "required": true
  -
    "attributes":
      "label": "Another module (optional)"
      "render": "nix"
    "id": "more"
    "type": "textarea"
  -
    "attributes":
      "label": "What you expected"
    "id": "expected"
    "type": "textarea"
    "validations":
      "required": true
  -
    "attributes":
      "description": "An error, a value, or the answer of the CI comment."
      "label": "What you got"
    "id": "got"
    "type": "textarea"
    "validations":
      "required": true
"description": "Something yen does, or does not do. A yen module that shows it is required."
"name": "Bug or question"
