# DO-NOT-EDIT. Generated by docs/modules/ci.nix (the docs fleet). Regenerate: cd docs && nix run .#write-files
# Jobs: docs, engine, eval-aarch64-darwin, eval-aarch64-linux, eval-x86_64-linux, flake-check, fleet, fmt
"concurrency":
  "cancel-in-progress": "${{ github.ref != 'refs/heads/main' && github.event.action == 'synchronize' }}"
  "group": "${{ github.workflow }}-${{ github.ref }}"
"jobs":
  "docs":
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "docs examples"
        "run": "nix develop ./docs -c docs-test"
      -
        "name": "docs flake check: pages and workflows current, examples, e2e"
        "run": "nix develop ./docs -c docs-check"
      -
        "name": "site build"
        "run": "nix develop ./docs -c docs-build"
    "timeout-minutes": 60
  "engine":
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "engine and library oracles"
        "run": "nix develop ./docs -c engine-test"
      -
        "name": "cost oracles (memos)"
        "run": "nix develop ./docs -c engine-cost"
    "timeout-minutes": 20
  "eval-aarch64-darwin":
    "needs":
      - "fleet"
    "runs-on": "macos-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "every aarch64-darwin target of ci.json evaluates"
        "run": "nix develop ./docs -c fleet-eval aarch64-darwin"
    "timeout-minutes": 30
  "eval-aarch64-linux":
    "needs":
      - "fleet"
    "runs-on": "ubuntu-24.04-arm"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "every aarch64-linux target of ci.json evaluates"
        "run": "nix develop ./docs -c fleet-eval aarch64-linux"
    "timeout-minutes": 30
  "eval-x86_64-linux":
    "needs":
      - "fleet"
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "every x86_64-linux target of ci.json evaluates"
        "run": "nix develop ./docs -c fleet-eval x86_64-linux"
    "timeout-minutes": 30
  "flake-check":
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "nix flake check of the fleet"
        "run": "nix develop ./docs -c fleet-check"
    "timeout-minutes": 120
  "fleet":
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "fleet checks"
        "run": "nix develop ./docs -c fleet-test"
      -
        "name": "real evaluations (e2e)"
        "run": "nix develop ./docs -c fleet-e2e"
      -
        "name": "trimmed module lists cost oracle"
        "run": "nix develop ./docs -c fleet-cost"
      -
        "name": "MCP server and flake app"
        "run": "nix develop ./docs -c fleet-mcp"
    "timeout-minutes": 120
  "fmt":
    "runs-on": "ubuntu-latest"
    "steps":
      -
        "uses": "actions/checkout@v4"
        "with":
          "fetch-depth": 0
      -
        "uses": "cachix/install-nix-action@v31"
        "with":
          "github_access_token": "${{ secrets.GITHUB_TOKEN }}"
      -
        "name": "every nix file is formatted (nixfmt)"
        "run": "nix develop ./docs -c fmt-check"
      -
        "name": "the workflows are valid (actionlint)"
        "run": "nix develop ./docs -c lint"
    "timeout-minutes": 30
"name": "test"
"on":
  "pull_request": {}
  "push": {}
  "workflow_dispatch": {}
"permissions":
  "contents": "read"
